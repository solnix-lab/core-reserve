[workspace]
members = ["crates/agent", "crates/bench", "crates/cli", "crates/telemetry"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
rustix = { version = "1.1", features = ["fs", "system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
